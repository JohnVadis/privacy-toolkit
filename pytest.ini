[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # Our own deprecations are bugs; a dependency's are noise.
    error::DeprecationWarning:documents
    error::DeprecationWarning:fill_forms
    error::DeprecationWarning:client_context
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:anyio
