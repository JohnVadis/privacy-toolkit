# Opt-out / removal site catalog. Add or remove sites as the client's checklist evolves.
# `needs` lists the client variables that site's form asks for (used to pre-fill the
# worklist so the worker copies/pastes instead of retyping).
#
# The list and its order follow the practice's own checklist ("The Process" sheet,
# 2026-10-12): data brokers, then real estate, maps, and Google's removal tool last —
# Google only shows what's still out there once the sources above are gone. The
# Government section of that sheet is the PDF forms side of the toolkit, and its
# Boolean-search rows are how exposures are found, so neither is listed here.
#
# `client_needed:` — the site needs the CLIENT themselves (a call, a text code, their
# own login). Shown prominently by the Opt-out Assistant so it can be arranged first.
#
# NOTE: These sites use CAPTCHAs, email verification, and their own terms of service.
# This tool PREPARES the values and tracks status — a human does the actual submit.
#
# Keys are what a client's worklist matches its rows on. Don't rename one; add a new
# key and remove the old one, and the worklist keeps the old row's history.
#
# optout_assist.py fills these forms by matching field labels, so most sites need
# nothing extra. If a site's fields have labels it can't read, add selectors that
# are tried first — check them in the browser's inspector, they change:
#   fill:
#     - { selector: "#first-name", from: first_name }
#     - { selector: "input[name=zip]", from: home_zip }

# --- Data brokers ------------------------------------------------------------
- key: acxiom
  name: Acxiom
  category: data_broker
  opt_out_url: "https://omnicom-privacy.my.onetrust.com/webform/c0a325be-6f68-46be-a0de-e4a750890f7d/eabea7bc-0774-4fb2-8906-d0c1adedb2c2"
  needs: [first_name, last_name, home_line1, home_city, home_state, home_zip, email, phone]
  supports_agent: true
  notes: "Acxiom Authorized Agent Portal (OneTrust; the old link now redirects here). Email verification follows."

- key: beenverified
  name: BeenVerified
  category: data_broker
  opt_out_url: "https://www.beenverified.com/svc/optout/search/optouts"
  needs: [first_name, last_name, home_state, email]
  supports_agent: true
  notes: "Search, pick the client's record, then confirm by email. A Cloudflare check may show first — it clears on its own after a few seconds."

- key: infotracer
