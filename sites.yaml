  needs: [full_name, home_full, email]
  supports_agent: true
  notes: "My Home: enter the address, prove ownership, then Remove Photos from the owner dashboard."

# --- Maps --------------------------------------------------------------------
- key: google_maps
  name: Google Maps
  category: maps
