name: build macOS app

# Builds "Privacy Toolkit.app" on a real Mac and leaves it as a downloadable
# artifact. PyInstaller cannot cross-compile, so this is how a Mac build gets made
# without owning a Mac to build it on — and what the recipient downloads needs
# nothing installed: no Python, no launcher, no Terminal.
#
# Run it from the Actions tab: "build macOS app" -> Run workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Two Macs, because a build runs only on the chip it was made for. macos-latest
    # is Apple Silicon; an Intel Mac would download it and get nothing that runs.
    # The tester picks by the name of the file.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Apple Silicon (M1, M2, M3, M4)
            suffix: apple-silicon
          - runner: macos-13
            label: Intel
            suffix: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write        # to attach the build to a release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 has ready-built packages for everything pinned here, which is the
          # thing most likely to fail on a version chosen for other reasons.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run the tests first
        # No point shipping an app whose engine is broken. The golden test skips
        # here only if the blank PDFs are missing; they are tracked, so it runs.
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Build the app
        run: python build_exe.py

      - name: Check what came out
        run: |
          APP="dist/Privacy Toolkit/Privacy Toolkit.app"
          test -d "$APP" || { echo "no .app was produced"; exit 1; }
          test -x "$APP/Contents/MacOS/Privacy Toolkit" || {
            echo "the bundle has no runnable executable"; exit 1; }
          echo "Built:"
          du -sh "$APP"
          ls "dist/Privacy Toolkit"

      - name: Check the shipped folder is complete
        # Inspects what was BUILT, not the checkout it was built from. A bundle
        # missing its beside-the-app files launches and then cannot fill anything,
        # which is a miserable thing to discover on someone else's Mac.
        run: |
          cd "dist/Privacy Toolkit"
          for required in               "sites.yaml"               "clients/_TEMPLATE.yaml"               "forms/mappings/hillsborough_clerk_redaction.map.yaml"               "forms/_blank_pdfs/Hillsborough_Redaction.pdf"               "READ ME FIRST.txt"; do
            test -f "$required" || { echo "missing from the build: $required"; exit 1; }
          done
          # The onedir duplicate must not be here: it doubles the download and
          # puts a second launchable-looking thing next to the real app.
          test ! -e "_internal" || { echo "_internal was left in the build"; exit 1; }
          test ! -e "Privacy Toolkit" || {
            echo "the raw executable was left beside the .app"; exit 1; }
          echo "beside the app:"
          ls
          echo "forms shipped: $(ls forms/mappings | wc -l) mapping(s), $(ls forms/_blank_pdfs | wc -l) blank PDF(s)"

      - name: Zip it
        run: |
          cd dist
          # -y keeps symlinks inside the bundle, which macOS frameworks rely on;
          # flattening them breaks the frameworks and the app will not launch.
          zip -qry "Privacy Toolkit for ${{ matrix.suffix }} Macs.zip" "Privacy Toolkit"
          ls -lh *.zip

      - name: Publish it as a release
        # A release asset rather than a build artifact: artifacts are capped by a
        # per-account storage quota that a few macOS builds will exhaust, and the
        # failure lands on the very last step after a working app has been built.
        # The tag is fixed and the asset is clobbered, so this is always "the
        # current Mac build" rather than an accumulating pile.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view macos-build >/dev/null 2>&1             || gh release create macos-build                  --title "Privacy Toolkit — macOS build"                  --notes "$(cat .github/release-notes.md)"
          gh release upload macos-build             "dist/Privacy Toolkit for ${{ matrix.suffix }} Macs.zip" --clobber
          echo "Download: $(gh release view macos-build --json url -q .url)"
