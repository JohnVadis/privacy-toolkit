name: build macOS app

# Builds "Privacy Toolkit.app" on a real Mac and leaves it as a downloadable
# artifact. PyInstaller cannot cross-compile, so this is how a Mac build gets made
# without owning a Mac to build it on — and what the recipient downloads needs
# nothing installed: no Python, no launcher, no Terminal.
#
# Run it from the Actions tab: "build macOS app" -> Run workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write        # to attach the build to a release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 has ready-built packages for everything pinned here, which is the
          # thing most likely to fail on a version chosen for other reasons.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run the tests first
        # No point shipping an app whose engine is broken. The golden test skips
        # here only if the blank PDFs are missing; they are tracked, so it runs.
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Build the app
        run: python build_exe.py

      - name: Check what came out
        run: |
          APP="dist/Privacy Toolkit/Privacy Toolkit.app"
          test -d "$APP" || { echo "no .app was produced"; exit 1; }
          test -x "$APP/Contents/MacOS/Privacy Toolkit" || {
            echo "the bundle has no runnable executable"; exit 1; }
          echo "Built:"
          du -sh "$APP"
          ls "dist/Privacy Toolkit"

      - name: Smoke-test the bundled engine
        # Proves the app's own Python can fill a form — that every module and data
        # file made it into the bundle. Catches a missing hidden import, which
        # otherwise only shows up on the user's first double-click.
        run: python -c "import fill_forms; keys=[m['form_key'] for m in fill_forms.list_mappings() if m['pdf_present']]; print('usable forms:', keys); assert keys, 'the build shipped no usable forms'"

      - name: Zip it
        run: |
          cd dist
          # -y keeps symlinks inside the bundle, which macOS frameworks rely on.
          zip -qry "Privacy Toolkit (macOS).zip" "Privacy Toolkit"
          ls -lh "Privacy Toolkit (macOS).zip"

      - name: Publish it as a release
        # A release asset rather than a build artifact: artifacts are capped by a
        # per-account storage quota that a few macOS builds will exhaust, and the
        # failure lands on the very last step after a working app has been built.
        # The tag is fixed and the asset is clobbered, so this is always "the
        # current Mac build" rather than an accumulating pile.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view macos-build >/dev/null 2>&1             || gh release create macos-build                  --title "Privacy Toolkit — macOS build"                  --notes "Built automatically from master. Download the zip below, unzip, and drag Privacy Toolkit.app wherever you want it. Nothing to install."
          gh release upload macos-build "dist/Privacy Toolkit (macOS).zip" --clobber
          echo "Download: $(gh release view macos-build --json url -q .url)"
