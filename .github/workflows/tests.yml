name: tests

# The county blank PDFs are gitignored (see .gitignore), so the golden test that
# fills the real Clerk form SKIPS here and runs on a machine that has them — which
# is any machine that can actually file. Everything else runs on a bare clone.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
